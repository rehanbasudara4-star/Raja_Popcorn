<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Raja Popcorn</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Lobster+Two:ital,wght@1,700&family=Nunito:wght@400;600&display=swap"
    rel="stylesheet">
  <style>
    :root {
      --bg: #1a0a08;
      --gold: #f6b93b;
      --cream: #fff1cf;
      --brown: #3b1608;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    * {
      box-sizing: border-box
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    body {
      margin: 0;
      min-height: 100vh;
      color: var(--cream);
      font-family: 'Nunito', system-ui, sans-serif;
      text-align: center;
      overflow-x: hidden;
      background: linear-gradient(180deg, #240c0b, var(--bg) 70%)
    }

    /* HERO: curtain stage */
    .hero {
      position: relative;
      height: min(84vh, 600px);
      min-height: 430px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse 50% 60% at 78% 0%, rgba(255, 214, 120, .35), transparent 70%), radial-gradient(ellipse 60% 50% at 50% 55%, rgba(246, 185, 59, .12), transparent 70%), #1d0b09
    }

    .peln {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 22px;
      z-index: 7;
      background: linear-gradient(#9a1c26, #4a070c);
      border-bottom: 3px solid #d99a25;
      box-shadow: 0 6px 14px rgba(0, 0, 0, .5)
    }

    .cur {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 52%;
      z-index: 6;
      pointer-events: none;
      background: repeating-linear-gradient(90deg, #7a1018 0 14px, #5a0a10 14px 30px, #93202a 30px 42px, #45070c 42px 58px);
      box-shadow: inset 0 -60px 70px rgba(0, 0, 0, .45)
    }

    .cur.l {
      left: 0;
      border-right: 4px solid #d99a25;
      animation: openL 2.6s .7s cubic-bezier(.7, 0, .2, 1) forwards
    }

    .cur.r {
      right: 0;
      border-left: 4px solid #d99a25;
      animation: openR 2.6s .7s cubic-bezier(.7, 0, .2, 1) forwards
    }

    @keyframes openL {
      to {
        transform: translateX(-84%)
      }
    }

    @keyframes openR {
      to {
        transform: translateX(84%)
      }
    }

    .tw {
      position: relative;
      z-index: 3;
      padding: 46px 34px 18px;
      cursor: pointer;
      outline: none;
      animation: reveal 1.8s 1.5s cubic-bezier(.2, .8, .2, 1) both;
      -webkit-tap-highlight-color: transparent
    }

    .tw:focus-visible {
      outline: 2px dashed var(--gold);
      outline-offset: 6px;
      border-radius: 20px
    }

    @keyframes reveal {
      from {
        opacity: 0;
        transform: scale(.82) translateY(20px);
        filter: blur(6px)
      }

      to {
        opacity: 1;
        transform: none;
        filter: none
      }
    }

    .tw.boom {
      animation: shake .6s
    }

    @keyframes shake {

      0%,
      100% {
        transform: none
      }

      15% {
        transform: scale(1.08) rotate(-2deg)
      }

      35% {
        transform: scale(.96) rotate(2deg)
      }

      55% {
        transform: scale(1.04) rotate(-1deg)
      }
    }

    h1 {
      margin: 0;
      font-family: 'Lobster Two', 'Brush Script MT', cursive;
      font-style: italic;
      font-weight: 700;
      line-height: .95;
      filter: drop-shadow(0 0 16px rgba(246, 185, 59, .5)) drop-shadow(0 4px 0 #2a0c04)
    }

    .line {
      position: relative;
      display: block;
      isolation: isolate;
      width: max-content;
      margin: 0 auto
    }

    .line::before {
      content: attr(data-t);
      position: absolute;
      left: 0;
      top: 0;
      z-index: -1;
      color: #4a1a08;
      -webkit-text-stroke: .2em #4a1a08;
      paint-order: stroke;
      white-space: nowrap
    }

    .line b {
      font-weight: inherit;
      display: block;
      color: transparent;
      -webkit-text-fill-color: transparent;
      -webkit-background-clip: text;
      background-clip: text;
      background-repeat: no-repeat;
      background-size: 260% 100%, 100% 100%;
      animation: glint 3.8s ease-in-out infinite
    }

    .l1 {
      font-size: clamp(4.4rem, 22vw, 9.5rem)
    }

    .l1 b {
      background-image: linear-gradient(105deg, transparent 42%, #fffdf0 50%, transparent 58%), linear-gradient(180deg, #ffd76a, #f4a927 55%, #c9801a)
    }

    .l2 {
      font-size: clamp(3rem, 14.5vw, 6.4rem);
      margin-top: -.12em
    }

    .l2 b {
      background-image: linear-gradient(105deg, transparent 42%, #fff 50%, transparent 58%), linear-gradient(180deg, #fffaf0, #f1dcae 60%, #d8b878);
      animation-delay: .5s
    }

    @keyframes glint {
      0% {
        background-position: 100% 0, 0 0
      }

      60%,
      100% {
        background-position: 0% 0, 0 0
      }
    }

    .crown {
      position: absolute;
      left: -.02em;
      top: -.5em;
      width: .78em;
      font-size: inherit;
      transform: rotate(-9deg);
      z-index: 2;
      filter: drop-shadow(0 0 8px rgba(255, 220, 120, .8))
    }

    .crown svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible
    }

    .star {
      position: absolute;
      width: var(--s);
      height: var(--s);
      background: #fff3c4;
      clip-path: polygon(50% 0, 60% 40%, 100% 50%, 60% 60%, 50% 100%, 40% 60%, 0 50%, 40% 40%);
      filter: drop-shadow(0 0 4px #ffd166);
      opacity: 0;
      animation: tw var(--d) ease-in-out infinite var(--dl);
      pointer-events: none;
      z-index: 4
    }

    @keyframes tw {

      0%,
      100% {
        opacity: 0;
        transform: scale(.3) rotate(0)
      }

      50% {
        opacity: 1;
        transform: scale(1) rotate(45deg)
      }
    }

    .tag {
      position: relative;
      z-index: 3;
      margin: 2px 16px 0;
      font-size: 1.05rem;
      opacity: .9;
      animation: reveal 1.4s 2.2s both
    }

    .tip {
      position: relative;
      z-index: 3;
      margin: 8px 16px 0;
      font-size: .85rem;
      opacity: .6;
      animation: reveal 1.4s 2.6s both
    }

    /* POSTER */
    main {
      padding: 36px 16px 40px
    }

    .stage {
      position: relative;
      width: min(88vw, 430px);
      margin: 0 auto;
      perspective: 900px
    }

    .poster {
      position: relative;
      transform-style: preserve-3d;
      transition: transform .2s ease-out;
      border-radius: 14px;
      box-shadow: 0 30px 60px rgba(0, 0, 0, .6), 0 0 0 1px rgba(246, 185, 59, .25)
    }

    .poster img {
      display: block;
      width: 100%;
      height: auto;
      border-radius: 14px
    }

    .poster.wiggle {
      animation: wig .6s ease
    }

    @keyframes wig {

      0%,
      100% {
        translate: 0 0
      }

      25% {
        translate: 0 -12px
      }

      50% {
        translate: 0 0
      }

      75% {
        translate: 0 -6px
      }
    }

    .hot {
      position: absolute;
      border: 0;
      background: transparent;
      cursor: pointer;
      border-radius: 16px;
      padding: 0
    }

    .hot:focus-visible {
      outline: 3px solid var(--gold);
      outline-offset: 2px
    }

    .hot:hover {
      background: rgba(255, 220, 130, .10)
    }

    #popL {
      left: 10%;
      top: 48%;
      width: 43%;
      height: 36%
    }

    #popR {
      left: 53%;
      top: 50%;
      width: 38%;
      height: 34%
    }

    #wa {
      left: 27%;
      top: 87.5%;
      width: 46%;
      height: 6.5%;
      display: block
    }

    .hint {
      margin: 18px 0 0;
      font-size: .95rem;
      opacity: .75
    }

    .deco {
      position: absolute;
      width: 44px;
      cursor: pointer;
      animation: fl 5s ease-in-out infinite;
      filter: drop-shadow(0 6px 6px rgba(0, 0, 0, .5))
    }

    .deco:hover {
      animation-duration: 1s
    }

    @keyframes fl {

      0%,
      100% {
        transform: translateY(0) rotate(-8deg)
      }

      50% {
        transform: translateY(-14px) rotate(10deg)
      }
    }

    footer {
      padding: 28px 16px 48px;
      border-top: 1px solid rgba(246, 185, 59, .2);
      max-width: 560px;
      margin: 0 auto
    }

    footer h2 {
      font-family: 'Lobster Two', cursive;
      font-style: italic;
      font-weight: 700;
      font-size: 1.8rem;
      margin: 0 0 16px;
      color: var(--gold)
    }

    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap
    }

    .links a {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 20px;
      border-radius: 999px;
      color: var(--cream);
      text-decoration: none;
      border: 1px solid rgba(246, 185, 59, .45);
      transition: .25s
    }

    .links a:hover,
    .links a:focus-visible {
      background: var(--gold);
      color: var(--brown);
      transform: translateY(-3px);
      outline: none
    }

    .links svg {
      width: 20px;
      height: 20px;
      fill: currentColor
    }

    small {
      display: block;
      margin-top: 22px;
      opacity: .55
    }

    #fx {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 50
    }

    .ring {
      position: fixed;
      width: 40px;
      height: 40px;
      margin: -20px 0 0 -20px;
      border-radius: 50%;
      border: 4px solid #ffd76a;
      box-shadow: 0 0 30px #f6b93b;
      pointer-events: none;
      z-index: 49;
      animation: ring .9s ease-out forwards
    }

    @keyframes ring {
      to {
        transform: scale(40);
        opacity: 0;
        border-width: 1px
      }
    }

    .flash {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 48;
      background: radial-gradient(circle at var(--x) var(--y), rgba(255, 230, 150, .75), transparent 60%);
      animation: fl2 .6s ease-out forwards
    }

    @keyframes fl2 {
      to {
        opacity: 0
      }
    }

    @media(prefers-reduced-motion:reduce) {
      .cur.l {
        animation: none;
        transform: translateX(-84%)
      }

      .cur.r {
        animation: none;
        transform: translateX(84%)
      }

      .tw,
      .tag,
      .tip {
        animation: none
      }

      .line b,
      .deco,
      .star {
        animation: none
      }

      .star {
        opacity: .8
      }
    }
  </style>
</head>

<body>
  <canvas id="fx"></canvas>
  <section class="hero" id="hero">
    <div class="peln"></div>
    <div class="cur l"></div>
    <div class="cur r"></div>
    <div class="tw" id="tw" role="button" tabindex="0" aria-label="Raja Popcorn. Activate for a popcorn explosion">
      <h1>
        <span class="line l1" data-t="Raja"><b>Raja</b>
          <span class="crown" aria-hidden="true">
            <svg viewBox="0 0 100 80">
              <defs>
                <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#ffe89a" />
                  <stop offset="1" stop-color="#e59a1c" />
                </linearGradient>
              </defs>
              <path d="M8 66 L4 22 L30 42 L50 8 L70 42 L96 22 L92 66 Z" fill="url(#g)" stroke="#4a1a08" stroke-width="5"
                stroke-linejoin="round" />
              <rect x="8" y="60" width="84" height="12" rx="4" fill="#f0b030" stroke="#4a1a08" stroke-width="4" />
              <circle cx="50" cy="8" r="6" fill="#ffe89a" stroke="#4a1a08" stroke-width="3" />
              <circle cx="4" cy="22" r="5" fill="#ffe89a" stroke="#4a1a08" stroke-width="3" />
              <circle cx="96" cy="22" r="5" fill="#ffe89a" stroke="#4a1a08" stroke-width="3" />
              <circle cx="50" cy="46" r="5" fill="#d8222e" />
              <circle cx="28" cy="58" r="3.5" fill="#d8222e" />
              <circle cx="72" cy="58" r="3.5" fill="#d8222e" />
            </svg>
          </span>
        </span>
        <span class="line l2" data-t="Popcorn"><b>Popcorn</b></span>
      </h1>
    </div>
    <p><br></p>
    <p class="tag">Cocok Untuk Cemilan Gabut Kalian 😋</p>
    <p class="tip">Murah • Enak • Bikin nagih</p>
  </section>
